name: Apply DB migrations

# Manually-triggered runner for supabase/migrations/*.sql (idempotent; tracked
# in _migrations). The CI runner has direct Postgres egress, which sandboxed
# environments often don't. Requires repo secrets:
#   POSTGRES_URL_NON_POOLING  (direct pg connection string; the migrate script
#                              also accepts POSTGRES_URL as a fallback)
# Optional (unused by migrate.ts today, kept for parity with crawl.yml):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Tolerant install (see crawl.yml: `npm ci` validation of the wasm32-wasi
      # optional-dep subtree disagrees across npm versions).
      - run: npm install --no-audit --no-fund

      - name: Apply migrations
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: npm run migrate
