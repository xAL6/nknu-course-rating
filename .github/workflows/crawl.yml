name: Nightly course crawl

# Refreshes the most recent semester(s) from NKNU's schedule into Supabase.
# Runs nightly and on manual dispatch. Requires repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    - cron: "30 18 * * *" # 02:30 Asia/Taipei (UTC+8)
  workflow_dispatch:
    inputs:
      year:
        description: "ROC year to crawl (e.g. 115). Blank = current default."
        required: false
        default: "115"
      sem:
        description: "Semester (1, 2, or 3). Blank = both 1 and 2."
        required: false
        default: ""

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # NOT `npm ci`: the lock is generated on Windows (dev), so the Linux-only
      # optional deps of @tailwindcss/oxide-wasm32-wasi (@emnapi/core/runtime,
      # @napi-rs/wasm-runtime) aren't pinned in it, and `npm ci` hard-fails with
      # "Missing: @emnapi/runtime from lock file". The crawler doesn't touch
      # Tailwind anyway, so a tolerant install that self-heals the platform drift
      # is the right call here.
      - run: npm install --no-audit --no-fund

      - name: Run crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YEAR: ${{ github.event.inputs.year || '115' }}
          SEM: ${{ github.event.inputs.sem }}
        run: |
          ARGS="--year $YEAR --delay 1200"
          if [ -n "$SEM" ]; then ARGS="$ARGS --sem $SEM"; fi
          echo "crawl args: $ARGS"
          npm run crawl:ci -- $ARGS
